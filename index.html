<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicianAgent | Premium Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Space Grotesk', sans-serif;
        }

        .logo span {
            color: var(--primary);
            -webkit-text-fill-color: var(--primary);
        }

        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            font-family: 'Space Grotesk', sans-serif;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .input-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            gap: 1rem;
        }

        textarea {
            flex: 1;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            color: white;
            font-size: 1rem;
            resize: none;
            height: 60px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        button {
            padding: 0 2rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .layout-stack {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .logs-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            height: 350px;
            display: flex;
            flex-direction: column;
        }

        .artifacts-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            min-height: 300px;
        }

        .section-header {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text);
        }

        .artifacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .card-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        .logs-content {
            flex: 1;
            padding: 1.25rem;
            overflow-y: auto;
            font-family: 'Space Grotesk', monospace;
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
            background: rgba(15, 23, 42, 0.3);
        }

        .log-entry {
            margin-bottom: 0.6rem;
            padding-left: 1rem;
            border-left: 2px solid var(--glass-border);
        }

        .log-entry.agent {
            color: var(--primary);
        }

        .log-entry.system {
            color: var(--accent);
        }

        .log-entry.error {
            color: #ef4444;
        }

        .track-item {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 16px;
            padding: 1.25rem;
            border: 1px solid var(--glass-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .track-item:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.08);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.3);
        }

        .track-name {
            font-weight: 700;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .track-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            font-family: 'Space Grotesk', sans-serif;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        audio {
            width: 100%;
            height: 32px;
            filter: invert(1) hue-rotate(180deg) brightness(1.5);
            margin-top: auto;
        }

        /* Animations */
        @keyframes pulse-thinking {
            0% {
                transform: scale(1);
                opacity: 1;
                box-shadow: 0 0 10px var(--accent);
            }

            50% {
                transform: scale(1.5);
                opacity: 0.6;
                box-shadow: 0 0 20px var(--accent);
            }

            100% {
                transform: scale(1);
                opacity: 1;
                box-shadow: 0 0 10px var(--accent);
            }
        }

        .thinking {
            animation: pulse-thinking 1.5s infinite ease-in-out;
            background: var(--primary) !important;
            box-shadow: 0 0 15px var(--primary) !important;
        }

        .btn-loading {
            opacity: 0.7;
            pointer-events: none;
            position: relative;
        }

        .btn-loading::after {
            content: "";
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .animate {
            animation: slideIn 0.5s ease forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">MUSICIAN<span>AGENT</span></div>
            <div class="studio-status">
                <span style="color: var(--text-muted); font-size: 0.9rem;">Studio:</span>
                <span style="color: var(--accent); font-weight: 600;"> ACTIVE</span>
            </div>
        </header>

        <section class="hero">
            <h1>Compose the <span>Future</span></h1>
            <p>High-fidelity music production via Maestro-Swarm orchestration.</p>
        </section>

        <div class="input-section">
            <div class="input-group">
                <textarea id="promptInput" placeholder="Describe your track..."></textarea>
                <button id="generateBtn">COMPOSE</button>
            </div>
        </div>

        <div class="layout-stack">
            <!-- LOGS ROW -->
            <div class="logs-card">
                <div class="card-header">
                    <div class="card-title">
                        <div class="status-dot" id="agentStatus"></div>MAESTRO ENGINE
                    </div>
                </div>
                <div class="logs-content" id="logPanel">
                    <div class="log-entry system">> Ready for instruction.</div>
                </div>
            </div>

            <!-- ARTIFACTS ROW -->
            <div class="artifacts-section">
                <div class="section-header">
                    <div class="section-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z">
                            </path>
                        </svg>
                        STUDIO ARTIFACTS
                    </div>
                </div>
                <div id="artifactsPanel" class="artifacts-grid">
                    <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">Waiting
                        for sounds...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BRIDGE_BASE = 'http://localhost:8080/proxy';
        let currentSessionId = null;

        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const logPanel = document.getElementById('logPanel');
        const artifactsPanel = document.getElementById('artifactsPanel');
        const agentStatus = document.getElementById('agentStatus');

        function addLog(text, type = 'system') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerText = `> ${text}`;
            logPanel.appendChild(entry);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        async function createSession() {
            const sessionId = 'session_' + Date.now();
            addLog(`Initializing Session: ${sessionId}`, "system");
            const resp = await fetch(`${BRIDGE_BASE}/sessions/${sessionId}`, { method: 'POST' });
            if (!resp.ok) throw new Error("Session creation failed");
            const data = await resp.json();
            addLog(`Session ${data.sessionId} active.`, "system");
            return data.sessionId;
        }

        async function pollForResults() {
            if (!currentSessionId) return;
            addLog("Artifact polling started...", "system");
            const pollInterval = setInterval(async () => {
                console.log("Polling for artifacts...");
                try {
                    const resp = await fetch(`${BRIDGE_BASE}/sessions/${currentSessionId}/status`);
                    if (!resp.ok) return;
                    const data = await resp.json();

                    if (data.artifacts && data.artifacts.length > 0) {
                        await renderArtifacts(data.artifacts);

                        if (data.artifacts.some(a => a.name.includes('master'))) {
                            clearInterval(pollInterval);
                            addLog("Master mix complete.", "system");
                            finishUI();
                        }
                    }
                } catch (e) {
                    console.error("Polling error:", e);
                }
            }, 3000);
        }

        async function generateMusic() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            generateBtn.classList.add('btn-loading');
            generateBtn.innerText = 'COMPOSING';
            agentStatus.classList.add('thinking');

            // Reset artifacts state for new session
            renderedArtifacts.clear();
            artifactsPanel.innerHTML = '';

            try {
                if (!currentSessionId) currentSessionId = await createSession();
                addLog(`Executing: "${prompt}"`, "agent");

                const resp = await fetch(`${BRIDGE_BASE}/sessions/${currentSessionId}/run`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: prompt })
                });

                if (resp.ok) {
                    addLog("Orchestration complete. Background synthesis started.", "system");
                    pollForResults();
                } else {
                    addLog("Execution failed. Check Bridge logs.", "error");
                    finishUI();
                }
            } catch (e) {
                addLog(`Error: ${e.message}`, "error");
                finishUI();
            }
        }

        function finishUI() {
            generateBtn.classList.remove('btn-loading');
            generateBtn.disabled = false;
            generateBtn.innerText = 'COMPOSE';
            agentStatus.classList.remove('thinking');
            agentStatus.style.background = '#10b981';
        }

        const renderedArtifacts = new Set();
        const metadataCache = {};

        async function renderArtifacts(artifacts) {
            const wavs = artifacts.filter(a => a.name.endsWith('.wav'));
            if (wavs.length === 0) return;

            for (const art of wavs) {
                const filename = art.name;
                if (renderedArtifacts.has(filename)) continue;

                console.log(`Rendering ${filename}`);

                const isMaster = filename.includes('master');
                const displayName = isMaster ? '✨ MASTER MIX' : `🎵 ${filename.replace('output_', '').replace('.wav', '').toUpperCase()}`;
                const audioUrl = `${BRIDGE_BASE}/sessions/${currentSessionId}/artifacts/${filename}`;

                let promptMeta = "Synthesized via Lyria 2";
                const metaArt = artifacts.find(a => a.name === `${filename}.json`);

                if (metaArt) {
                    if (metadataCache[filename]) {
                        promptMeta = metadataCache[filename];
                    } else {
                        try {
                            const mResp = await fetch(`${BRIDGE_BASE}/sessions/${currentSessionId}/artifacts/${metaArt.name}`);
                            if (mResp.ok) {
                                const mData = await mResp.json();
                                promptMeta = `Prompt: "${mData.prompt}"`;
                                metadataCache[filename] = promptMeta;
                            }
                        } catch (e) { }
                    }
                }

                const item = document.createElement('div');
                item.className = 'track-item animate';
                item.style.borderLeft = isMaster ? '4px solid var(--primary)' : '4px solid var(--accent)';

                // Clear initial placeholder
                if (renderedArtifacts.size === 0) {
                    artifactsPanel.innerHTML = '';
                }

                item.innerHTML = `
                    <div class="track-name">
                        <span style="${isMaster ? 'color: var(--primary); font-weight: 800;' : ''}">${displayName}</span>
                        <a href="${audioUrl}" download="${filename}" title="Download WAV" style="color: var(--text-muted); text-decoration: none;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4M7 10l5 5 5-5M12 15V3"/></svg>
                        </a>
                    </div>
                    <div class="track-meta" title="${promptMeta}">${promptMeta}</div>
                    <audio controls src="${audioUrl}"></audio>
                `;

                if (isMaster) {
                    artifactsPanel.prepend(item);
                } else {
                    artifactsPanel.appendChild(item);
                }
                renderedArtifacts.add(filename);
            }
        }

        generateBtn.addEventListener('click', generateMusic);
        promptInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') generateMusic(); });
    </script>
</body>

</html>
